# Render Blueprint — lets you deploy with one click via "New + > Blueprint"
# instead of clicking through the manual web-service form.
services:
  - type: web
    name: internlink
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "10000"