# Render Blueprint — lets you deploy with one click via "New + > Blueprint"
# instead of clicking through the manual web-service form.
databases:
  - name: internlink-db
    plan: free
    databaseName: internlink
    user: internlink

services:
  - type: web
    name: internlink
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: internlink-db
          property: connectionString
    # NOTE: Render's free Postgres instance is deleted 30 days after creation.
    # When that happens, delete the old "internlink-db" database in the
    # Render dashboard, create a new free Postgres database, and update this
    # service's DATABASE_URL env var to point at it (or just re-run the
    # Blueprint, which recreates both). Data seeds fresh automatically.
